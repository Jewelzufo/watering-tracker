# Modern high-quality theme for Plant Watering Tracker
# Light, editorial palette: deep emerald + warm paper + soft sage

[theme]
base = "light"
primaryColor = "#0E7A5F"
backgroundColor = "#FBFBF8"
secondaryBackgroundColor = "#EEF3EC"
textColor = "#1A2E22"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false
